<div class="canvas-container" #threejsCanvas></div>
<div class="login-container">
  <div class="login-card glass-panel">
    <div class="login-header">
      <div class="logo">
        <i class="material-icons" style="font-size: 2rem;">show_chart</i>
      </div>
      <h2>Welcome Back</h2>
      <p>Sign in to access your dashboard</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="material-icons">email</i>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="Enter your email"
            [class.invalid]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched"
          >
        </div>
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
          Please enter a valid email address.
        </div>
      </div>

      <div class="form-group">
        <label for="password">Password</label>
        <div class="input-wrapper">
          <i class="material-icons">lock</i>
          <input 
            [type]="showPassword() ? 'text' : 'password'" 
            id="password" 
            formControlName="password" 
            placeholder="Enter your password"
            [class.invalid]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched"
          >
          <i class="material-icons toggle-password" (click)="togglePasswordVisibility()">
            {{ showPassword() ? 'visibility_off' : 'visibility' }}
          </i>
        </div>
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
          Password must be at least 6 characters.
        </div>
      </div>

      <div class="error-alert" *ngIf="errorMessage()">
        <i class="material-icons">error_outline</i>
        <span>{{ errorMessage() }}</span>
      </div>

      <button type="submit" class="btn-primary" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Sign In</span>
        <span *ngIf="isLoading()" class="spinner"><i class="material-icons spin">refresh</i></span>
      </button>

      <div class="auth-links" style="margin-top: 1.5rem; text-align: center;">
        <p style="margin-bottom: 0.5rem;">
          <a routerLink="/forgot-password" style="color: var(--text-secondary); text-decoration: none; font-size: 0.9rem;">Forgot password?</a>
        </p>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">
          Don't have an account? 
          <a routerLink="/signup" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Sign up</a>
        </p>
      </div>
    </form>
  </div>
</div>
