<div class="settings">
  <div class="settings-header">
    <h1>Settings</h1>
    <p>Manage your account settings and preferences.</p>
  </div>

  <div class="settings-content">
    <form [formGroup]="settingsForm" (ngSubmit)="saveSettings()">
      <div class="settings-section">
        <h2>Notifications</h2>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="notifications" />
            <span>Enable notifications</span>
          </label>
        </div>
        <div class="form-group">
          <label class="checkbox-label">
            <input type="checkbox" formControlName="emailUpdates" />
            <span>Email updates</span>
          </label>
        </div>
      </div>

      <div class="settings-section">
        <h2>Appearance</h2>
        <div class="form-group">
          <label class="checkbox-label">
            <input 
              type="checkbox" 
              formControlName="darkMode"
              (change)="toggleDarkMode()"
            />
            <span>Dark mode</span>
          </label>
          <p class="form-hint">Switch between light and dark themes</p>
        </div>
        <div class="form-group">
          <label>Customize Cards</label>
          <a routerLink="/card-editor" class="btn btn-secondary">Open Card Editor</a>
          <p class="form-hint">Edit styling, colors, and typography for dashboard cards</p>
        </div>
      </div>

      <div class="settings-section">
        <h2>Regional</h2>
        <div class="form-group">
          <label>Language</label>
          <select formControlName="language" class="form-control">
            <option value="en">English</option>
            <option value="es">Spanish</option>
            <option value="fr">French</option>
          </select>
        </div>
        <div class="form-group">
          <label>Timezone</label>
          <select formControlName="timezone" class="form-control">
            <option value="UTC">UTC</option>
            <option value="IST">IST (Indian Standard Time)</option>
            <option value="EST">EST</option>
            <option value="PST">PST</option>
          </select>
        </div>
      </div>

      <div class="settings-actions">
        <button type="submit" class="btn btn-primary">Save Settings</button>
        <button type="button" class="btn btn-secondary">Cancel</button>
      </div>
    </form>
  </div>
</div>
