<div class="login-container">
  <div class="login-card glass-panel">
    <div class="login-header">
      <div class="logo">
        <i class="fas fa-key"></i>
      </div>
      <h2>Reset Password</h2>
      <p>Enter your email to receive a reset link</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="onSubmit()" class="login-form">
      <div class="form-group" *ngIf="!successMessage()">
        <label for="email">Email</label>
        <div class="input-wrapper">
          <i class="fas fa-envelope"></i>
          <input 
            type="email" 
            id="email" 
            formControlName="email" 
            placeholder="Enter your email"
            [class.invalid]="resetForm.get('email')?.invalid && resetForm.get('email')?.touched"
          >
        </div>
        <div class="error-message" *ngIf="resetForm.get('email')?.invalid && resetForm.get('email')?.touched">
          Please enter a valid email address.
        </div>
      </div>

      <div class="error-alert" *ngIf="errorMessage()">
        <i class="fas fa-exclamation-circle"></i>
        <span>{{ errorMessage() }}</span>
      </div>

      <div class="success-alert" *ngIf="successMessage()" style="background: rgba(34, 197, 94, 0.1); color: #22c55e; padding: 1rem; border-radius: 12px; margin-bottom: 1.5rem; display: flex; align-items: center; gap: 0.75rem; font-size: 0.9rem; border: 1px solid rgba(34, 197, 94, 0.2);">
        <i class="fas fa-check-circle" style="font-size: 1.1rem;"></i>
        <span>{{ successMessage() }}</span>
      </div>

      <button *ngIf="!successMessage()" type="submit" class="btn-primary" [disabled]="isLoading()">
        <span *ngIf="!isLoading()">Send Reset Link</span>
        <span *ngIf="isLoading()" class="spinner"><i class="fas fa-circle-notch fa-spin"></i></span>
      </button>

      <div class="auth-links" style="margin-top: 1.5rem; text-align: center;">
        <p style="color: var(--text-secondary); font-size: 0.9rem;">
          Remembered your password? 
          <a routerLink="/login" style="color: var(--primary-color); text-decoration: none; font-weight: 600;">Log in</a>
        </p>
      </div>
    </form>
  </div>
</div>
