<header class="header" [class.collapsed]="isCollapsed1()">
  <div class="header-content">
    <div class="header-left">
      <h1 class="page-title">{{ pageTitle | async }}</h1>
    </div>
    
    <div class="header-right">
      <div class="search-box">
        <span class="material-icons">search</span>
        <input type="text" placeholder="Search..." />
      </div>
      
   
        <button class="theme-toggle" (click)="toggleDarkMode()" [title]="isDarkMode$ ? 'Switch to Light Mode' : 'Switch to Dark Mode'" aria-label="Toggle theme">
          <span class="material-icons">{{ isDarkMode$ ? 'light_mode' : 'dark_mode' }}</span>
        </button>
      
      
      <div class="notifications">
        <button class="icon-btn" aria-label="Notifications">
          <span class="material-icons">notifications</span>
          <span class="badge">3</span>
        </button>
      </div>
      
      <div class="user-menu" [class.open]="isMenuOpen | async">
        <button class="user-btn" (click)="toggleMenu()" aria-label="User menu">
          @if (user$ | async; as user) {
            <div class="user-avatar">
              {{ user.name.charAt(0) }}
            </div>
            <span class="user-name">{{ user.name }}</span>
          }
          <span class="material-icons">expand_more</span>
        </button>
        
        <div class="dropdown-menu" *ngIf="isMenuOpen | async">
          <a routerLink="/profile" class="dropdown-item" (click)="closeMenu()">
            <span class="material-icons">person</span>
            <span>Profile</span>
          </a>
          <a routerLink="/settings" class="dropdown-item" (click)="closeMenu()">
            <span class="material-icons">settings</span>
            <span>Settings</span>
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" (click)="logout()">
            <span class="material-icons">logout</span>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
