<header class="header" [class.collapsed]="isCollapsed1()">
  <div class="header-content">
    <div class="header-left">
      <button class="hamburger-btn" (click)="toggleMobileNav.emit()" aria-label="Toggle navigation">
        <span class="material-icons">menu</span>
      </button>
      <h1 class="page-title">{{ pageTitle | async }}</h1>
    </div>

    <div class="header-right">
      <div class="search-box">
        <span class="material-icons">search</span>
        <input type="text" placeholder="Search..." />
      </div>


      <button class="theme-toggle icon-btn" (click)="toggleDarkMode()"
        [title]="isDarkMode$ ? 'Switch to Light Mode' : 'Switch to Dark Mode'" aria-label="Toggle theme">
        <span class="material-icons">{{ isDarkMode$ ? 'light_mode' : 'dark_mode' }}</span>
      </button>

      <button class="icon-btn" (click)="toggleFullscreen()" [title]="isFullscreen ? 'Exit Fullscreen' : 'Fullscreen'"
        aria-label="Toggle fullscreen">
        <span class="material-icons">{{ isFullscreen ? 'fullscreen_exit' : 'fullscreen' }}</span>
      </button>

      <button class="icon-btn" (click)="exportConfig()" title="Export Configuration" aria-label="Export config">
        <span class="material-icons">download</span>
      </button>

      <button class="icon-btn" (click)="fileInput.click()" title="Import Configuration" aria-label="Import config">
        <span class="material-icons">upload</span>
      </button>
      <input type="file" #fileInput accept=".json" (change)="importConfig($event)" style="display: none;">

      <div class="notifications">
        <button class="icon-btn" aria-label="Notifications">
          <span class="material-icons">notifications</span>
          <span class="badge">3</span>
        </button>
      </div>

      <div class="user-menu" [class.open]="isMenuOpen | async">
        <button class="user-btn" (click)="toggleMenu()" aria-label="User menu">
          @if (user$ | async; as user) {
          <div class="user-avatar">
            {{ user.name.charAt(0) }}
          </div>
          <span class="user-name">{{ user.name }}</span>
          }
          <span class="material-icons">expand_more</span>
        </button>

        <div class="dropdown-menu" *ngIf="isMenuOpen | async">
          <a routerLink="/profile" class="dropdown-item" (click)="closeMenu()">
            <span class="material-icons">person</span>
            <span>Profile</span>
          </a>
          <a routerLink="/settings" class="dropdown-item" (click)="closeMenu()">
            <span class="material-icons">settings</span>
            <span>Settings</span>
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item" (click)="logout()">
            <span class="material-icons">logout</span>
            <span>Logout</span>
          </button>
        </div>
      </div>
    </div>
  </div>
</header>
